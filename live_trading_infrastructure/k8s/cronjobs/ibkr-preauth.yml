apiVersion: batch/v1
kind: CronJob
metadata:
  name: ibkr-preauth
  namespace: trading
spec:
  schedule: "0 5 * * 1-5"    # 5:00am ET Mon-Fri
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: orchestrator
          restartPolicy: Never
          containers:
          - name: preauth
            image: sureshotcapital/multi-strategy-api:latest
            command:
            - python3
            - -c
            - |
              import os, sys, time, random, requests
              from SureshotSDK.ibkr.automation.client import RetryClient

              MAX_ATTEMPTS = 10
              BASE_DELAY_SECONDS = 30
              MAX_DELAY_SECONDS = 3600
              ALERT_AFTER_ATTEMPT = 4  # start Telegram-alerting once we've failed this many times

              def _send_telegram(message):
                  token = os.environ.get("TELEGRAM_BOT_TOKEN")
                  chat_id = os.environ.get("TELEGRAM_CHAT_ID")
                  if not token or not chat_id:
                      return
                  try:
                      requests.post(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data={"chat_id": chat_id, "text": message},
                          timeout=10,
                      )
                  except Exception:
                      pass

              def notify_success():
                  _send_telegram("Ready to Trade \U0001F4B0")

              def notify_failure(message):
                  _send_telegram(message)

              last_error = None
              for attempt in range(1, MAX_ATTEMPTS + 1):
                  try:
                      RetryClient()._ensure_authenticated()
                      print(f"IBKR pre-auth OK (attempt {attempt}/{MAX_ATTEMPTS})")
                      notify_success()
                      sys.exit(0)
                  except Exception as e:
                      last_error = e
                      print(f"IBKR pre-auth attempt {attempt}/{MAX_ATTEMPTS} failed: {e}")
                      if attempt >= ALERT_AFTER_ATTEMPT:
                          notify_failure(f"IBKR pre-auth attempt {attempt}/{MAX_ATTEMPTS} failed: {e}")
                      if attempt < MAX_ATTEMPTS:
                          delay = min(BASE_DELAY_SECONDS * (2 ** (attempt - 1)), MAX_DELAY_SECONDS)
                          delay += random.uniform(0, delay * 0.1)  # jitter, avoids lock-step retries
                          print(f"Retrying in {delay:.0f}s...")
                          time.sleep(delay)

              sys.exit(1)
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "300m"
                memory: "512Mi"
            env:
            - name: IBKR_GATEWAY_URL
              value: "https://ib-gateway-service:5000/v1/api"
            - name: IBKR_GATEWAY_HTTP_URL
              value: "https://ib-gateway-service:5000"
            - name: IBKR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ib-credentials
                  key: username
            - name: IBKR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ib-credentials
                  key: password
            - name: IBKR_SECRET
              valueFrom:
                secretKeyRef:
                  name: ib-credentials
                  key: otp_secret
            - name: IBKR_ACCT_NUMBER
              valueFrom:
                secretKeyRef:
                  name: ib-credentials
                  key: account_number
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-credentials
                  key: bot_token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: telegram-credentials
                  key: chat_id
