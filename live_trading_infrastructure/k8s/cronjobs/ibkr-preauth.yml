apiVersion: batch/v1
kind: CronJob
metadata:
  name: ibkr-preauth
  namespace: trading
spec:
  schedule: "0 8 * * 1-5"    # 8:00am ET Mon-Fri
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: orchestrator
          restartPolicy: OnFailure
          containers:
          - name: preauth
            image: sureshotcapital/multi-strategy-api:latest
            command:
            - python3
            - -c
            - |
              import os, sys, requests
              from SureshotSDK.ibkr.automation.client import RetryClient

              def notify_failure(message):
                  token = os.environ.get("TELEGRAM_BOT_TOKEN")
                  chat_id = os.environ.get("TELEGRAM_CHAT_ID")
                  if not token or not chat_id:
                      return
                  try:
                      requests.post(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data={"chat_id": chat_id, "text": message},
                          timeout=10,
                      )
                  except Exception:
                      pass

              try:
                  RetryClient()._ensure_authenticated()
                  print("IBKR pre-auth OK")
              except Exception as e:
                  notify_failure(f"IBKR pre-auth FAILED: {e}")
                  sys.exit(1)
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "300m"
                memory: "512Mi"
            env:
            - name: IBKR_GATEWAY_URL
              value: "https://ib-gateway-service:5000/v1/api"
            - name: IBKR_GATEWAY_HTTP_URL
              value: "https://ib-gateway-service:5000"
            - name: IBKR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ib-credentials
                  key: username
            - name: IBKR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ib-credentials
                  key: password
            - name: IBKR_SECRET
              valueFrom:
                secretKeyRef:
                  name: ib-credentials
                  key: otp_secret
            - name: IBKR_ACCT_NUMBER
              valueFrom:
                secretKeyRef:
                  name: ib-credentials
                  key: account_number
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-credentials
                  key: bot_token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: telegram-credentials
                  key: chat_id
