---
# Provisions the ephemeral trading-app worker: walks provider_attempts in order
# and stops at the first that yields a Ready node, so a provider outage or a
# boot-wedge fails over instead of losing the trading day. See README.md.
#
# Run by orchestrator system cron at 8:30am ET Mon-Fri (see orchestrator.yml).
# Requires env vars: VULTR_API_KEY, VULTR_SSH_KEY_ID

- name: Provision worker node
  hosts: localhost
  connection: local
  become: yes
  vars:
    vultr_api_key: "{{ lookup('env', 'VULTR_API_KEY') }}"
    ssh_key_id: "{{ lookup('env', 'VULTR_SSH_KEY_ID') }}"
    worker_plan: "vx1-g-2c-8g-120s"
    worker_os_id: 2284
    join_token_ttl: 1800            # 30 min; regenerated per attempt
    node_ready_timeout: 720         # 12 min per attempt to reach Ready

    instances_file: /opt/trading/secrets/worker_instances

    # Ordered attempts; first Ready node wins. Second cloud goes LAST — see
    # README "Adding a second cloud".
    provider_attempts:
      - { provider: vultr, region: ewr }
      - { provider: vultr, region: atl }

  tasks:
    - name: Read SSH public key (injected into each worker via user_data)
      command: cat /root/.ssh/authorized_keys
      register: ssh_pubkey
      ignore_errors: yes

    - name: Initialise attempt state
      set_fact:
        worker_ready: false
        provider_api_down: false

    - name: Run provisioning attempts in order until one node is Ready
      include_tasks: provision_attempt.yml
      loop: "{{ provider_attempts }}"
      loop_control:
        loop_var: attempt
        label: "{{ attempt.provider }}/{{ attempt.region }}"
      when: not worker_ready

    # --- Success path -----------------------------------------------------
    - name: Label worker node for trading-app scheduling
      command: microk8s kubectl label node trading-worker trading-node=worker --overwrite
      when: worker_ready

    - name: Log success
      lineinfile:
        path: /var/log/trading/provision_worker.log
        line: "{{ lookup('pipe', 'date -Is') }} [provision] SUCCESS worker Ready+labeled via {{ worker_actual_provider }}/{{ worker_actual_region }}"
        create: yes
      when: worker_ready

    # --- Telemetry (receipt, not a page); best-effort, never fatal ---------
    - name: Read Telegram credentials for notification
      shell: |
        microk8s kubectl get secret telegram-credentials -n trading -o jsonpath='{.data.bot_token}' | base64 -d
        echo
        microk8s kubectl get secret telegram-credentials -n trading -o jsonpath='{.data.chat_id}' | base64 -d
      register: tg_creds
      ignore_errors: yes
      no_log: true

    - name: Notify — failover succeeded on a non-primary attempt
      shell: >
        curl -s --max-time 10 -X POST
        "https://api.telegram.org/bot{{ (tg_creds.stdout_lines[0] | default('')) }}/sendMessage"
        -d chat_id="{{ (tg_creds.stdout_lines[1] | default('')) }}"
        -d text="✅ trading-worker provisioned via FAILOVER: {{ worker_actual_provider }}/{{ worker_actual_region }} (primary attempt did not win). Pod scale-up at 9:25."
      ignore_errors: yes
      when:
        - worker_ready
        - not (worker_actual_provider == provider_attempts[0].provider and worker_actual_region == provider_attempts[0].region)
        - (tg_creds.stdout_lines[0] | default('')) != ''

    - name: Notify — total failure, no worker today
      shell: >
        curl -s --max-time 10 -X POST
        "https://api.telegram.org/bot{{ (tg_creds.stdout_lines[0] | default('')) }}/sendMessage"
        -d chat_id="{{ (tg_creds.stdout_lines[1] | default('')) }}"
        -d text="🚨 trading-worker provisioning FAILED across all providers/regions. No worker today. Instances tracked in {{ instances_file }} for teardown. Check /var/log/trading/provision_worker.log."
      ignore_errors: yes
      when:
        - not worker_ready
        - (tg_creds.stdout_lines[0] | default('')) != ''

    - name: Fail the play if no worker was provisioned
      fail:
        msg: "No provider produced a Ready trading-worker node. See /var/log/trading/provision_worker.log."
      when: not worker_ready
